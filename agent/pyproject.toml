[project]
name = "tech-support-agent"
version = "0.1.0"
description = "OpenAPI-driven support subgraph with explicit approval of API writes"
requires-python = ">=3.14,<3.15"
dependencies = [
    "langchain>=1.3.10",
    "langchain-openai>=1.7.3",
    "langgraph>=1.0.0",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.28.1",
    "pydantic>=2.12.0",
    "pyyaml>=6.0.2",
    "openapi-spec-validator>=0.7.2",
    "openapi-schema-validator>=0.6.3",
    "langgraph-checkpoint-sqlite>=3.0.0",
    "tzdata>=2025.2",
]

[project.scripts]
support-chat = "tech_support_agent.cli:main"

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest-asyncio>=1.0.0",
    "pip-audit>=2.10.1",
    "pre-commit>=4.6.2",
    "pytest>=9.0.3",
    "ruff>=0.8.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
]

[tool.ruff]
target-version = "py314"
# pre-commit runs ruff from the repo root, so without this neither
# ``tech_support_agent`` nor ``tests`` is recognised as first-party and the
# import sorter folds them into the third-party block. These are ruff's own
# defaults, re-anchored: paths are relative to this file, so they resolve to
# ``agent/`` and ``agent/src``.
src = [".", "src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
# Tests import helpers via ``tests.conftest``, so ``agent/`` has to be
# importable no matter how pytest is invoked — ``uv run pytest`` does not add it
# the way ``python -m pytest`` does.
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.uv.build-backend]
module-name = "tech_support_agent"
source-include = [".env.example", "examples/**", "tests/**"]
