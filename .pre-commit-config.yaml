fail_fast: true

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements # catches leftover breakpoint() / pdb

  # - repo: https://github.com/codespell-project/codespell
  #   rev: v2.4.1
  #   hooks:
  #     - id: codespell

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.11
    hooks:
      - id: ruff
        name: ruff-import-sort
        args: [ --fix, --select, I ]
      - id: ruff-format

  # - repo: https://github.com/executablebooks/mdformat
  #   rev: 0.7.22
  #   hooks:
  #     - id: mdformat
  #       additional_dependencies: [mdformat-myst]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
      - id: gitleaks

  # - repo: https://github.com/PyCQA/bandit
  #   rev: 1.8.3
  #   hooks:
  #     - id: bandit
  #       args: [ "-c", "pyproject.toml" ]
  #       additional_dependencies: [ "bandit[toml]" ]

  - repo: local
    hooks:
      - id: pip-audit
        name: pip-audit
        entry: uv run --directory agent pip-audit
        language: system
        pass_filenames: false
        always_run: true

  # - repo: local
  #   hooks:
  #     - id: ty-check
  #       name: ty check
  #       entry: uv run ty check
  #       language: system
  #       pass_filenames: false
  #       always_run: true

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: uv run --directory agent pytest tests/ -x -q
        language: system
        pass_filenames: false
        always_run: true
