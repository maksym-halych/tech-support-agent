[project]
name = "lessons-api"
version = "0.1.0"
description = "Lessons API: teachers, lesson slots and bookings"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.162.0",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "pyjwt[crypto]>=2.15.1",
    "tzdata>=2026.6",
    "uvicorn>=0.54.0",
]

[project.scripts]
lessons-api = "lessons_api.main:main"
lessons-api-export-openapi = "lessons_api.main:export_openapi"
lessons-api-role = "lessons_api.roles:main"

[build-system]
requires = ["uv_build>=0.8.15,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py314"
# pre-commit runs ruff from the repo root; anchor first-party detection to
# ``api/`` and ``api/src`` so imports sort the same either way.
src = [".", "src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pip-audit>=2.10.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
